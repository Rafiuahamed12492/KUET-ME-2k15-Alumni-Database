
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KUET ME 2k15 Alumni Database</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        :root {
            --gold:  #D6AA58;
            --teal:  #A9CDD4;
            --mist:  #E1EBF0;
            --white: #FFFFFF;
            --steel: #477A91;
            --ink:   #1F3A47;   /* dark text colour, derived from the steel blue */
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--white); margin: 0; padding: 20px; color: var(--ink); }
        .container { max-width: 1400px; margin: auto; background: var(--white); padding: 20px; border-radius: 8px; border: 1px solid var(--mist); box-shadow: 0 4px 14px rgba(71,122,145,0.15); }
        h1 { color: var(--steel); text-align: center; }
        .kpis { display: flex; gap: 20px; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; }
        .kpi { flex: 1; min-width: 150px; background: var(--mist); padding: 20px; border-radius: 8px; border-top: 4px solid var(--gold); text-align: center; }
        .kpi:nth-child(2) { background: var(--teal); }
        .kpi h3 { margin: 0; color: var(--ink); font-size: 14px; }
        .kpi p { margin: 10px 0 0; font-size: 28px; font-weight: bold; color: var(--steel); }
        .kpi:nth-child(2) p { color: var(--ink); }
        .filters { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; background: var(--mist); padding: 25px 20px; border-radius: 8px; align-items: center; justify-content: center;}
        .filters select { padding: 8px 10px; margin: 0; box-sizing: border-box; height: 42px; border-radius: 4px; border: 1px solid var(--steel); background: var(--white); color: var(--ink); outline: none; font-family: inherit; font-size: 14px; }
        .filters select:focus { box-shadow: 0 0 0 3px var(--teal); }
        .filters button { padding: 0 20px; margin: 0; box-sizing: border-box; height: 42px; background: var(--steel); color: var(--white); border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .filters button:hover { background: var(--gold); color: var(--ink); }
        .charts { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .chart-container { flex: 1; min-width: 300px; background: var(--white); border: 1px solid var(--teal); padding: 15px; border-radius: 8px; }
        .table-container { overflow-x: auto; border: 1px solid var(--teal); border-radius: 8px; background: var(--white); }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--mist); font-size: 14px; }
        th { background-color: var(--steel); color: var(--white); white-space: nowrap; position: sticky; top: 0; border-bottom: 3px solid var(--gold); }
        tbody tr:nth-child(even) { background: rgba(225,235,240,0.6); }
        tbody tr:hover { background: rgba(214,170,88,0.25); }
        .social-link { display: inline-block; margin: 2px; text-decoration: none; font-weight: 600; padding: 4px 8px; border-radius: 4px; font-size: 12px; transition: 0.2s; }
        .li-link { background-color: var(--white); color: var(--steel); border: 1px solid var(--steel); }
        .li-link:hover { background-color: var(--steel); color: var(--white); }
        .fb-link { background-color: var(--mist); color: var(--ink); border: 1px solid var(--teal); }
        .fb-link:hover { background-color: var(--gold); color: var(--ink); border-color: var(--gold); }
    </style>
</head>

                countryCounts[d.Country] = (countryCounts[d.Country] || 0) + 1;
                engCounts[d.Engagement] = (engCounts[d.Engagement] || 0) + 1;
            });

            const cData = Object.entries(countryCounts).sort((a,b) => b[1] - a[1]).slice(0, 10);
            const eData = Object.entries(engCounts).sort((a,b) => b[1] - a[1]);
            const totalFiltered = currentData.length;

            if(countryChart) countryChart.destroy();
            countryChart = new Chart(document.getElementById('countryChart'), {
                type: 'bar',
                data: {
                    labels: cData.map(x => x[0]),
                    datasets: [{ label: 'Alumni', data: cData.map(x => x[1]), backgroundColor: '#477A91', borderRadius: 4 }]
                },
                options: { 
                    layout: { padding: { top: 30 } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grace: '20%',
                            ticks: { precision: 0 }
                        }
                    },
                    plugins: { 
                        title: { display: true, text: 'Top Countries (Filtered)' },
                        legend: { display: false },
                        datalabels: {
                            anchor: 'end',
                            align: 'top',
                            formatter: (value, ctx) => {
                                let pct = totalFiltered > 0 ? ((value / totalFiltered) * 100).toFixed(1) : 0;
                                return `${value} (${pct}%)`;
                            },
                            font: { weight: 'bold', size: 11 },
                            color: INK
                        }
                    } 
                }
            });

            if(engChart) engChart.destroy();
            engChart = new Chart(document.getElementById('engChart'), {
                type: 'doughnut',
                data: {
                    labels: eData.map(x => x[0]),
                    datasets: [{ data: eData.map(x => x[1]), backgroundColor: ['#477A91', '#D6AA58', '#A9CDD4', '#E1EBF0', '#FFFFFF', '#B58A3E', '#7FB0BB', '#2F5568'], borderColor: INK, borderWidth: 1.5 }]
                },
                options: { 
                    layout: { padding: 10 },
                    plugins: { 
                        title: { display: true, text: 'Engagement Type (Filtered)' },
                        datalabels: {
                            color: ctx => (ctx.dataIndex === 0 || ctx.dataIndex === 7) ? '#FFFFFF' : INK,
                            textAlign: 'center',
                            formatter: (value, ctx) => {
                                let pct = totalFiltered > 0 ? ((value / totalFiltered) * 100).toFixed(1) : 0;
                                return pct > 4 ? `${value}\n(${pct}%)` : ''; // Hide for very tiny slices to prevent overlap
                            },
                            font: { weight: 'bold', size: 11 }
                        }
                    } 
                }
            });
        }

        function updateTable() {
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = '';
            currentData.forEach(d => {
                let links = '';
                if(d.LinkedIn && d.LinkedIn !== 'N/A' && d.LinkedIn.trim() !== '') {
                    let url = d.LinkedIn.trim();
                    if(!url.startsWith('http')) url = 'https://' + url;
                    links += `<a href="${url}" target="_blank" class="social-link li-link">🔗 LinkedIn</a>`;
                }
                if(d.Facebook && d.Facebook !== 'N/A' && d.Facebook.trim() !== '') {
                    let url = d.Facebook.trim();
                    if(!url.startsWith('http')) url = 'https://' + url;
                    links += `<a href="${url}" target="_blank" class="social-link fb-link">📘 Facebook</a>`;
                }

                tbody.innerHTML += `<tr>
                    <td><strong>${d.Name}</strong></td>
                    <td>${d.Roll}</td>
                    <td>${d.Country}</td>
                    <td>${d.Engagement}</td>
                    <td>${d.Degree}</td>
                    <td>${d.Organization}</td>
                    <td>${d.Phone}</td>
                    <td>${links}</td>
                </tr>`;
            });
        }

        function resetFilters() {
            document.getElementById('rollFilter').value = "";
            document.getElementById('countryFilter').value = "";
            document.getElementById('engFilter').value = "";
            updateDashboard();
        }

        // Initialize
        initFilters();
        updateDashboard();
    </script>
</body>
</html>
